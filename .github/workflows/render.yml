name: Render Addison weather
on:
  schedule:
    - cron: "7 * * * *"      # hourly at :07 (GitHub may run a few minutes late)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r renderer/requirements.txt
      - run: python renderer/render.py --out site
        env: { TZ: America/Chicago }
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true
